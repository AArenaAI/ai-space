version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aipool-backend
    ports:
      - "9091:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:./data/dev.db
      - JWT_SECRET=${JWT_SECRET:-aipool-secret-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    networks:
      - aipool-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aipool-frontend
    ports:
      - "9090:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:9091
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aipool-network

networks:
  aipool-network:
    driver: bridge
