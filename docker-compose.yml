version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aipool-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aipool}
      - POSTGRES_USER=${POSTGRES_USER:-aipool}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aipool}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - aipool-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aipool-backend
    ports:
      - "9091:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgres://aipool:aipool@postgres:5432/aipool?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-aipool-secret-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipool-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aipool-frontend
    ports:
      - "9090:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:9091
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aipool-network

networks:
  aipool-network:
    driver: bridge

volumes:
  postgres-data:
